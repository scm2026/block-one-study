<html>
<head>

<title>Diag A — position:fixed</title>
<style>
  html,body{margin:0;padding:0;font:16px -apple-system,sans-serif}
  body{width:2400px;height:3000px;background:

  <div class="panel">DIAG A<br>position: fixed<br>no JS at all<br>pinch-zoom the background<br>and watch this box</div>
